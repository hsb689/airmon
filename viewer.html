<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌面空气监测站 - 数据查看器</title>
<style>
  :root{
    --bg:#12161c; --panel:#1a2029; --line:#2a3340; --fg:#e6ecf4;
    --dim:#8a94a2; --green:#3fb950; --yellow:#d29922; --red:#f85149;
    --blue:#58a6ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    font-size:14px;
  }
  header{
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:var(--panel); position:sticky; top:0; z-index:10;
  }
  h1{font-size:16px; margin:0; font-weight:600}
  .sub{color:var(--dim); font-size:12px}
  .spacer{flex:1}
  button,label.btn{
    background:#26303d; color:var(--fg); border:1px solid var(--line);
    padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px;
    font-family:inherit;
  }
  button:hover,label.btn:hover{background:#303c4c; border-color:#3d4a5c}
  button.active{background:#1f6feb; border-color:#1f6feb}
  input[type=file]{display:none}
  input[type=datetime-local]{
    background:#0f141a; color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit;
    color-scheme:dark;
  }
  main{padding:18px 20px; max-width:1400px; margin:0 auto}

  #drop{
    border:2px dashed var(--line); border-radius:10px; padding:60px 20px;
    text-align:center; color:var(--dim); cursor:pointer; transition:.15s;
  }
  #drop.hover{border-color:var(--blue); color:var(--blue); background:#16202c}
  #drop b{color:var(--fg); display:block; font-size:16px; margin-bottom:8px}

  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:14px 16px; margin-bottom:16px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .row + .row{margin-top:10px}
  .tag{font-size:12px; color:var(--dim); min-width:52px}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
  .stat{background:#151b23; border:1px solid var(--line); border-radius:8px; padding:10px 12px}
  .stat .k{font-size:11px; color:var(--dim); margin-bottom:4px}
  .stat .v{font-size:20px; font-weight:600}
  .stat .u{font-size:11px; color:var(--dim); margin-left:4px}

  canvas{width:100%; height:320px; display:block; background:#0d1117;
         border:1px solid var(--line); border-radius:8px}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{padding:6px 10px; text-align:right; border-bottom:1px solid var(--line);
        white-space:nowrap}
  th{color:var(--dim); font-weight:500; text-align:right}
  th:first-child,td:first-child{text-align:left}
  .scroll{max-height:420px; overflow:auto; border-radius:8px}
  .hide{display:none}
</style>
</head>
<body>

<header>
  <h1>桌面空气监测站 · 数据查看器</h1>
  <span class="sub" id="meta">未加载数据</span>
  <span class="spacer"></span>
  <label class="btn" for="file">选择 JSON…</label>
  <input type="file" id="file" accept=".json,application/json">
</header>

<main>
  <div id="drop">
    <b>把 airmon.json 拖到这里</b>
    或者点右上角「选择 JSON…」<br><br>
    <span style="font-size:12px">
      生成方法：在 airmon 目录运行<br>
      <code style="color:#58a6ff">tools\dbjson.exe build\airmon.db build\airmon.json</code>
    </span>
  </div>

  <div id="view" class="hide">
    <div class="card">
      <div class="row">
        <span class="tag">指标</span>
        <span id="metrics"></span>
      </div>
      <div class="row">
        <span class="tag">范围</span>
        <span id="ranges"></span>
        <span class="spacer"></span>
        <span class="sub" id="rangeInfo"></span>
      </div>
      <div class="row hide" id="customRow">
        <span class="tag">时间</span>
        <input type="datetime-local" id="dtFrom">
        <span class="sub">至</span>
        <input type="datetime-local" id="dtTo">
        <button id="btnApply">应用</button>
        <button id="btnFull">全部数据</button>
      </div>
    </div>

    <div class="card">
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <canvas id="chart"></canvas>
      <div class="sub" id="chartHint" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <span class="tag">数据表</span>
        <span class="sub" id="tableInfo"></span>
        <span class="spacer"></span>
        <button id="btnLatest">最新 200 条</button>
        <button id="btnAll">全部</button>
      </div>
      <div class="scroll"><table id="tbl">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
  </div>
</main>

<script>
/* ============================================================
   数据结构(由 tools/dbjson.exe 生成):
     raw:    [ts, hcho, tvoc, eco2, temp, humi, aqi, eco, thi]
     minute: [ts, m0mn,m0av,m0mx, m1mn,... ]   8 指标 x (min,avg,max)

   存储缩放(和上位机一致):
     temp/humi 是 x100, eco/thi 是 x10, 其余是原值

   横轴: 用"点序号"而不是时间比例 —— 中间断了几小时也不留空白,
         所有数据点铺满整个图表, 横轴下方标出对应时刻。
   ============================================================ */

const METRICS = [
  { key:'hcho', name:'甲醛',     unit:'µg/m³', scale:1,   gb:80    },
  { key:'tvoc', name:'TVOC',     unit:'µg/m³', scale:1,   gb:600   },
  { key:'eco2', name:'二氧化碳', unit:'ppm',   scale:1,   gb:1000  },
  { key:'temp', name:'温度',     unit:'℃',     scale:100, gb:null  },
  { key:'humi', name:'湿度',     unit:'%RH',   scale:100, gb:null  },
  { key:'aqi',  name:'空气质量', unit:'',      scale:1,   gb:100   },
  { key:'eco',  name:'一氧化碳', unit:'ppm',   scale:10,  gb:8     },
  { key:'thi',  name:'热指数',   unit:'',      scale:10,  gb:null  },
];

const RANGES = [
  { name:'5分钟', sec:300      },
  { name:'1小时', sec:3600     },
  { name:'5小时', sec:5*3600   },
  { name:'7天',   sec:7*86400  },
  { name:'1个月', sec:30*86400 },
  { name:'任意',  sec:0, custom:true },
];

let DATA = null;
let curMetric = 0;
let curRange = 0;
let customFrom = 0, customTo = 0;   /* unix 秒 */
let showAllRows = false;

const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2, '0');

/* ---------------- 加载 ---------------- */
function loadJSON(text, srcName) {
  let obj;
  try { obj = JSON.parse(text); }
  catch (e) { alert('JSON 解析失败：' + e.message); return; }
  if (!obj || !Array.isArray(obj.raw)) { alert('文件格式不对：缺少 raw 数组'); return; }

  DATA = obj;
  $('drop').classList.add('hide');
  $('view').classList.remove('hide');

  const nRaw = obj.raw.length;
  const nMin = (obj.minute || []).length;
  $('meta').textContent =
    `${srcName || '数据'} · 原始 ${nRaw} 条 · 分钟聚合 ${nMin} 条 · 导出时间 ${obj.generated || '?'}`;

  /* 自定义时间的默认值: 最近 1 小时 */
  const last = lastTsOf(DATA.raw) || Math.floor(Date.now()/1000);
  customTo = last;
  customFrom = last - 3600;
  $('dtFrom').value = toLocalInput(customFrom);
  $('dtTo').value   = toLocalInput(customTo);

  buildButtons();
  render();
}

function lastTsOf(rows) {
  for (let i = rows.length - 1; i >= 0; i--) if (rows[i] && rows[i][0]) return rows[i][0];
  return 0;
}

function toLocalInput(ts) {
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T` +
         `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function readFile(file) {
  const fr = new FileReader();
  fr.onload = () => loadJSON(fr.result, file.name);
  fr.readAsText(file, 'utf-8');
}

$('file').addEventListener('change', e => {
  if (e.target.files[0]) readFile(e.target.files[0]);
});

const drop = $('drop');
drop.addEventListener('click', () => $('file').click());
['dragenter','dragover'].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave','drop'].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) readFile(f);
});

/* ---------------- 按钮 ---------------- */
function buildButtons() {
  const m = $('metrics');
  m.innerHTML = '';
  METRICS.forEach((x, i) => {
    const b = document.createElement('button');
    b.textContent = x.name;
    if (i === curMetric) b.classList.add('active');
    b.onclick = () => { curMetric = i; buildButtons(); render(); };
    m.appendChild(b);
  });

  const r = $('ranges');
  r.innerHTML = '';
  RANGES.forEach((x, i) => {
    const b = document.createElement('button');
    b.textContent = x.name;
    if (i === curRange) b.classList.add('active');
    b.onclick = () => { curRange = i; buildButtons(); render(); };
    r.appendChild(b);
  });

  $('customRow').classList.toggle('hide', !RANGES[curRange].custom);
}

$('btnApply').onclick = () => {
  const f = $('dtFrom').value, t = $('dtTo').value;
  if (!f || !t) { alert('请选择起始和结束时间'); return; }
  const fs = Math.floor(new Date(f).getTime()/1000);
  const ts = Math.floor(new Date(t).getTime()/1000);
  if (!(ts > fs)) { alert('结束时间必须晚于起始时间'); return; }
  customFrom = fs; customTo = ts;
  render();
};

$('btnFull').onclick = () => {
  /* 用数据里最早~最新的一段 */
  let first = 0;
  for (const r of DATA.raw) { if (r && r[0]) { first = r[0]; break; } }
  const last = lastTsOf(DATA.raw);
  if (!first || !last) return;
  customFrom = first; customTo = last;
  $('dtFrom').value = toLocalInput(customFrom);
  $('dtTo').value   = toLocalInput(customTo);
  render();
};

$('btnLatest').onclick = () => { showAllRows = false; render(); };
$('btnAll').onclick    = () => { showAllRows = true;  render(); };

/* ---------------- 取数 ---------------- */
/* 返回 { ts:[绝对秒], mn:[], av:[], mx:[] } —— 已换算成真实量纲 */
function series() {
  const m = METRICS[curMetric];
  const rg = RANGES[curRange];

  let from, to, useRaw;

  if (rg.custom) {
    from = customFrom; to = customTo;
    useRaw = (to - from) <= 5 * 3600;
  } else {
    /* 右端 = 该表里最新一条, 左端 = 右端 - 范围 */
    const rowsForEnd = (rg.sec <= 5*3600) ? DATA.raw : (DATA.minute || []);
    to = lastTsOf(rowsForEnd) || Math.floor(Date.now()/1000);
    from = to - rg.sec;
    useRaw = rg.sec <= 5 * 3600;
  }

  const rows = useRaw ? DATA.raw : (DATA.minute || []);
  const out = { ts:[], mn:[], av:[], mx:[] };

  for (const row of rows) {
    if (!row) continue;
    const ts = row[0];
    if (ts < from || ts > to) continue;

    if (useRaw) {
      const v = row[curMetric + 1] / m.scale;
      out.ts.push(ts); out.mn.push(v); out.av.push(v); out.mx.push(v);
    } else {
      const base = 1 + curMetric * 3;
      out.ts.push(ts);
      out.mn.push(row[base]     / m.scale);
      out.av.push(row[base + 1] / m.scale);
      out.mx.push(row[base + 2] / m.scale);
    }
  }
  out.from = from; out.to = to; out.useRaw = useRaw;
  return out;
}

/* ---------------- 渲染 ---------------- */
function render() {
  const s = series();
  const m = METRICS[curMetric];
  const n = s.ts.length;

  const fmtFull = t => new Date(t*1000).toLocaleString('zh-CN');
  $('rangeInfo').textContent = n
    ? `${n} 个点 · ${fmtFull(s.ts[0])} ~ ${fmtFull(s.ts[n-1])}`
    : '这个范围内没有数据';

  /* 统计 */
  let lo = Infinity, hi = -Infinity, sum = 0;
  for (let i = 0; i < n; i++) {
    if (s.mn[i] < lo) lo = s.mn[i];
    if (s.mx[i] > hi) hi = s.mx[i];
    sum += s.av[i];
  }
  const avg = n ? sum / n : 0;
  const over = (m.gb != null) ? s.mx.filter(v => v > m.gb).length : 0;

  /* 断档统计: 相邻两点间隔超过中位数的 5 倍就算一次断档 */
  let gaps = 0, gapSec = 0;
  if (n > 2) {
    const diffs = [];
    for (let i = 1; i < n; i++) diffs.push(s.ts[i] - s.ts[i-1]);
    const sorted = [...diffs].sort((a,b) => a-b);
    const med = sorted[Math.floor(sorted.length/2)] || 0;
    if (med > 0) {
      for (const d of diffs) if (d > med * 5) { gaps++; gapSec += d; }
    }
  }

  const stats = [
    { k:'最小', v: n ? lo.toFixed(2) : '--', u:m.unit },
    { k:'平均', v: n ? avg.toFixed(2) : '--', u:m.unit },
    { k:'最大', v: n ? hi.toFixed(2) : '--', u:m.unit },
    { k:'国标限值', v: m.gb != null ? m.gb : '无', u:m.gb != null ? m.unit : '' },
    { k:'超标点数', v: m.gb != null ? over : '--', u: m.gb != null ? '个' : '' },
    { k:'断档', v: gaps, u: gaps ? `次 / 共 ${fmtDur(gapSec)}` : '无' },
  ];
  $('stats').innerHTML = stats.map(x =>
    `<div class="stat"><div class="k">${x.k}</div>
     <div class="v">${x.v}<span class="u">${x.u}</span></div></div>`).join('');

  drawChart(s, m);
  renderTable(s, m);
}

function fmtDur(sec) {
  if (sec < 60) return sec + '秒';
  if (sec < 3600) return (sec/60).toFixed(0) + '分钟';
  if (sec < 86400) return (sec/3600).toFixed(1) + '小时';
  return (sec/86400).toFixed(1) + '天';
}

/* ---------------- 画图 (横轴=点序号, 空档不留白) ---------------- */
function drawChart(s, m) {
  const cv = $('chart');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const L = 62, R = 18, T = 16, B = 40;
  const x0 = L, x1 = W - R, y0 = T, y1 = H - B;
  const n = s.ts.length;

  if (!n) {
    g.fillStyle = '#8a94a2'; g.font = '13px "Microsoft YaHei UI",sans-serif';
    g.textAlign = 'center';
    g.fillText('这个范围内没有数据', W/2, H/2);
    $('chartHint').textContent = '';
    return;
  }

  /* 纵轴范围: 数据 + 国标线 */
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++) {
    if (s.mn[i] < lo) lo = s.mn[i];
    if (s.mx[i] > hi) hi = s.mx[i];
  }
  if (m.gb != null && m.gb > hi) hi = m.gb;
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pd = (hi - lo) * 0.1;
  lo -= pd; hi += pd;

  /* 横轴: 点序号均分 */
  const X = i => n === 1 ? (x0 + x1) / 2 : x0 + i / (n - 1) * (x1 - x0);
  const Y = v => y1 - (v - lo) / (hi - lo) * (y1 - y0);

  /* 横向网格 + 纵轴刻度 */
  g.strokeStyle = '#232c38'; g.lineWidth = 1;
  g.fillStyle = '#8a94a2'; g.font = '11px "Microsoft YaHei UI",sans-serif';
  g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4;
    const y = Y(v);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.fillText(v.toFixed(Math.abs(v) >= 100 ? 0 : 1), x0 - 6, y);
  }

  /* 断档标记: 相邻两点间隔远超中位数时, 画一条淡竖线提醒"这里缺数据" */
  if (n > 2) {
    const diffs = [];
    for (let i = 1; i < n; i++) diffs.push(s.ts[i] - s.ts[i-1]);
    const sorted = [...diffs].sort((a,b) => a-b);
    const med = sorted[Math.floor(sorted.length/2)] || 0;
    if (med > 0) {
      g.strokeStyle = '#3a2f18'; g.lineWidth = 1; g.setLineDash([2,3]);
      for (let i = 1; i < n; i++) {
        if (s.ts[i] - s.ts[i-1] > med * 5) {
          const x = X(i);
          g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
        }
      }
      g.setLineDash([]);
    }
  }

  /* 国标线 */
  if (m.gb != null && m.gb >= lo && m.gb <= hi) {
    const y = Y(m.gb);
    g.strokeStyle = '#7bd88f'; g.setLineDash([5,4]); g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.setLineDash([]);
    g.fillStyle = '#7bd88f'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillText('国标 ' + m.gb, x0 + 4, y - 6);
  }

  /* min-max 包络 */
  if (n > 1) {
    g.beginPath();
    for (let i = 0; i < n; i++) g.lineTo(X(i), Y(s.mn[i]));
    for (let i = n - 1; i >= 0; i--) g.lineTo(X(i), Y(s.mx[i]));
    g.closePath();
    g.fillStyle = 'rgba(63,185,80,.18)'; g.fill();
  }

  /* avg 折线 */
  if (n === 1) {
    g.fillStyle = '#3fb950';
    g.beginPath(); g.arc(X(0), Y(s.av[0]), 3, 0, Math.PI*2); g.fill();
  } else {
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const x = X(i), y = Y(s.av[i]);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.strokeStyle = '#3fb950'; g.lineWidth = 1.6; g.stroke();
  }

  /* ---- 横轴时间刻度 ---- */
  const span = s.to - s.from;
  const withDate = span > 12 * 3600;
  const fmtAxis = t => {
    const d = new Date(t*1000);
    const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    return withDate ? `${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${hm}` : hm;
  };

  const ticks = Math.min(6, n);
  g.fillStyle = '#8a94a2'; g.font = '11px "Microsoft YaHei UI",sans-serif';
  g.textBaseline = 'top';
  for (let k = 0; k < ticks; k++) {
    const i = ticks === 1 ? 0 : Math.round(k * (n - 1) / (ticks - 1));
    const x = X(i);

    g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1);
    g.strokeStyle = '#1b232d'; g.lineWidth = 1; g.stroke();

    if (k === 0)              g.textAlign = 'left';
    else if (k === ticks - 1) g.textAlign = 'right';
    else                      g.textAlign = 'center';
    g.fillText(fmtAxis(s.ts[i]), x, y1 + 8);
  }

  $('chartHint').textContent =
    '绿色实线 = 平均值，浅绿区域 = 该时段最小~最大范围，绿色虚线 = 国标限值；' +
    '横轴按数据点均分（中间没数据的时间不占位置），淡色竖虚线标出断档位置。';
}

/* ---------------- 数据表 ---------------- */
function renderTable(s, m) {
  const head = $('thead'), body = $('tbody');
  head.innerHTML = `<th>时间</th><th>${m.name}${m.unit ? `(${m.unit})` : ''}</th>`;

  const n = s.ts.length;
  const start = showAllRows ? 0 : Math.max(0, n - 200);
  const rows = [];
  for (let i = n - 1; i >= start; i--) {
    rows.push([new Date(s.ts[i]*1000).toLocaleString('zh-CN'), s.av[i].toFixed(2)]);
  }
  body.innerHTML = rows.map(r =>
    `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');

  $('tableInfo').textContent = `显示 ${rows.length} 条（共 ${n} 个点）`;
}

let rt = null;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (DATA) render(); }, 150);
});
</script>
</body>
</html>
